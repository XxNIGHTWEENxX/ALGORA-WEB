<!DOCTYPE html>
<html lang="es">
<head>

<title>Página no encontrada · ALGORA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{min-height:100dvh;display:flex;flex-direction:column;background:#08080a;color:#ECE8DF;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(50% 40% at 50% 30%,rgba(216,166,87,.13),transparent 70%)}
  header{position:relative;padding:22px 24px;display:flex;justify-content:center}
  header img{height:26px;width:auto}
  main{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 48px}
  .box{max-width:520px;text-align:center}
  .num{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(96px,22vw,150px);font-weight:600;line-height:.9;background:linear-gradient(135deg,#F2CE84 0%,#D8A657 50%,#A87A35 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .line{width:64px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,#D8A657,transparent)}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(28px,6vw,38px);font-weight:600;line-height:1.15}
  p{margin-top:12px;color:#a59d8e;font-size:15.5px;line-height:1.6}
  .actions{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 24px;border-radius:14px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
  a.gold{background:linear-gradient(135deg,#F2CE84 0%,#D8A657 55%,#C0893F 100%);color:#1a1206;box-shadow:0 8px 28px rgba(216,166,87,.22)}
  a.gold:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(216,166,87,.32)}
  a.line-btn{border:1px solid rgba(216,166,87,.45);color:#D8A657}
  a.line-btn:hover{background:rgba(216,166,87,.08)}
  .help{margin-top:26px;font-size:14px;color:#8d8574}
  .help a{color:#D8A657;text-decoration:none;font-weight:600}
  footer{position:relative;padding:18px;text-align:center;font-size:12.5px;color:#6f6a60}
  @media (max-width:480px){.actions{flex-direction:column}a.btn{width:100%}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header><a href="/" aria-label="ALGORA, inicio"><img src="/ALGORA_Logo_blanco.png" alt="ALGORA" width="104" height="27"></a></header>
<main>
  <div class="box">
    <div class="num" aria-hidden="true">404</div>
    <div class="line" aria-hidden="true"></div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Desde el inicio encuentras todo lo que ALGORA hace por tu negocio.</p>
    <div class="actions">
      <a class="btn gold" href="/">Ir al inicio</a>
      <a class="btn line-btn" href="/#precios">Ver planes</a>
    </div>
    <p class="help">¿Buscabas algo en particular? <a href="https://wa.me/525659186986?text=Hola%2C%20busco%20informaci%C3%B3n%20de%20ALGORA" rel="noopener">Escríbenos por WhatsApp</a></p>
  </div>
</main>
<footer>ALGORA · algora.com.mx</footer>
</body>
</html>
